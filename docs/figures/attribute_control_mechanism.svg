<svg viewBox="0 0 760 920" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="R-cubed attribute guidance: a regressor predicts an attribute value from recent tokens, compares it to a target, and its gradient is scaled by lambda and added to the model's own logits before sampling.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Inter", "Segoe UI", sans-serif; fill: #111; }
    .box { fill: #f3f2ef; stroke: #333; stroke-width: 1.5; }
    .box-accent { fill: #dce8fb; stroke: #2a78d6; stroke-width: 1.8; }
    .label { font-size: 13px; }
    .sub { font-size: 11px; fill: #555; }
    .edge-label { font-size: 11px; fill: #444; }
    .edge { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Row 1: two inputs -->
  <rect class="box" x="60" y="20" width="270" height="56" rx="8"/>
  <text class="label" x="195" y="44" text-anchor="middle">Committed tokens</text>
  <text class="sub" x="195" y="62" text-anchor="middle">(hard window, already generated)</text>

  <rect class="box" x="430" y="20" width="270" height="56" rx="8"/>
  <text class="label" x="565" y="44" text-anchor="middle">Tentative next-token</text>
  <text class="sub" x="565" y="62" text-anchor="middle">distribution (soft, this step)</text>

  <!-- converge to embed+average -->
  <line class="edge" x1="195" y1="76" x2="330" y2="120"/>
  <line class="edge" x1="565" y1="76" x2="430" y2="120"/>

  <rect class="box" x="255" y="126" width="250" height="46" rx="8"/>
  <text class="label" x="380" y="154" text-anchor="middle">Embed each &amp; average</text>

  <line class="edge" x1="380" y1="172" x2="380" y2="212"/>

  <rect class="box" x="280" y="216" width="200" height="42" rx="8"/>
  <text class="label" x="380" y="242" text-anchor="middle">Mean embedding</text>

  <line class="edge" x1="380" y1="258" x2="380" y2="298"/>
  <text class="edge-label" x="392" y="282">frozen EBT embedding table</text>

  <rect class="box-accent" x="255" y="302" width="250" height="52" rx="8"/>
  <text class="label" x="380" y="324" text-anchor="middle">Regressor</text>
  <text class="sub" x="380" y="342" text-anchor="middle">(small MLP, trained offline)</text>

  <line class="edge" x1="380" y1="354" x2="380" y2="394"/>

  <rect class="box" x="280" y="398" width="200" height="42" rx="8"/>
  <text class="label" x="380" y="424" text-anchor="middle">Predicted value</text>

  <!-- Target merges in -->
  <rect class="box" x="560" y="398" width="150" height="42" rx="8"/>
  <text class="label" x="635" y="424" text-anchor="middle">Target (T)</text>

  <line class="edge" x1="480" y1="419" x2="560" y2="419"/>
  <line class="edge" x1="380" y1="440" x2="380" y2="480"/>
  <line class="edge" x1="635" y1="440" x2="450" y2="480"/>

  <rect class="box" x="230" y="484" width="300" height="52" rx="8"/>
  <text class="label" x="380" y="506" text-anchor="middle">Energy</text>
  <text class="sub" x="380" y="524" text-anchor="middle">weight × (predicted − target)²</text>

  <line class="edge" x1="380" y1="536" x2="380" y2="576"/>
  <text class="edge-label" x="392" y="560">∂energy / ∂logits</text>

  <rect class="box" x="255" y="580" width="250" height="42" rx="8"/>
  <text class="label" x="380" y="606" text-anchor="middle">Energy gradient</text>

  <line class="edge" x1="380" y1="622" x2="380" y2="662"/>
  <text class="edge-label" x="200" y="646">× λ (guidance strength)</text>

  <rect class="box" x="255" y="666" width="250" height="42" rx="8"/>
  <text class="label" x="380" y="692" text-anchor="middle">Scaled nudge</text>

  <!-- Base model logits merges in -->
  <rect class="box" x="60" y="666" width="150" height="42" rx="8"/>
  <text class="label" x="135" y="686" text-anchor="middle">Model's own</text>
  <text class="sub" x="135" y="700" text-anchor="middle">natural logits</text>

  <line class="edge" x1="380" y1="708" x2="380" y2="748"/>
  <line class="edge" x1="135" y1="708" x2="330" y2="748"/>

  <rect class="box" x="255" y="752" width="250" height="42" rx="8"/>
  <text class="label" x="380" y="778" text-anchor="middle">Combined logits</text>

  <line class="edge" x1="380" y1="794" x2="380" y2="834"/>

  <rect class="box-accent" x="255" y="838" width="250" height="46" rx="8"/>
  <text class="label" x="380" y="866" text-anchor="middle">Sample next token</text>

  <!-- gating note -->
  <rect x="518" y="470" width="222" height="158" rx="8" fill="none" stroke="#8a887f" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="sub" x="629" y="492" text-anchor="middle" font-weight="600">Only on gated steps</text>
  <text class="sub" x="629" y="512" text-anchor="middle">REMI: only when the model</text>
  <text class="sub" x="629" y="526" text-anchor="middle">is about to pick a token</text>
  <text class="sub" x="629" y="540" text-anchor="middle">type this attribute lives in</text>
  <text class="sub" x="629" y="562" text-anchor="middle">Anticipation: only at the</text>
  <text class="sub" x="629" y="576" text-anchor="middle">matching triplet position</text>
  <text class="sub" x="629" y="598" text-anchor="middle">(elsewhere: energy = 0,</text>
  <text class="sub" x="629" y="612" text-anchor="middle">no nudge applied)</text>
</svg>
